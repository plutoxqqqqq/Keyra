name: Build Keyra IPA

# Builds the host app and its embedded keyboard extension on a GitHub-hosted
# macOS runner, packages CustomKeyboard.ipa, validates its structure and uploads
# it as a workflow artifact (and optionally attaches it to a Release).
#
# The IPA is UNSIGNED on purpose: SideStore signs it on the device with your own
# Apple ID. Nothing here needs an Apple Developer account, a certificate or a
# provisioning profile.

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner label'
        required: false
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-14
      xcode:
        description: 'Xcode to use — a version such as 26.0, or a full path (empty = newest installed)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Also attach the IPA to a GitHub Release (downloadable without signing in)'
        required: false
        default: false
        type: boolean

# Needed only for the optional Release upload step.
permissions:
  contents: write

concurrency:
  group: keyra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build and package the IPA
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------------- toolchain
      - name: Report the runner and toolchain
        run: |
          echo "=== Runner ==="
          sw_vers || true
          uname -m
          echo "=== Installed Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          echo "=== Current developer directory ==="
          xcode-select -p || true
          echo "=== Default Xcode ==="
          xcodebuild -version || true
          echo "=== Available SDKs ==="
          xcodebuild -showsdks 2>/dev/null || true
          echo "=== iphoneos SDK ==="
          xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "(missing)"
          echo "=== Swift ==="
          swift --version 2>/dev/null || echo "(no swift)"
          echo "=== Python ==="
          python3 --version 2>/dev/null || echo "(no python3)"

      - name: Select the Xcode toolchain
        run: |
          set -uo pipefail
          requested="${{ inputs.xcode }}"
          # Lexical sort is enough here (Xcode_14, Xcode_15, Xcode_16, Xcode_26…).
          candidates="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort || true)"
          chosen=""
          if [ -n "${requested}" ]; then
            if [ -d "${requested}/Contents/Developer" ]; then
              chosen="${requested}"
            else
              chosen="$(printf '%s\n' "${candidates}" | grep -i "Xcode_${requested}" | tail -n 1 || true)"
            fi
            if [ -z "${chosen}" ]; then
              echo "::warning title=Requested Xcode not found::'${requested}' was not found on this runner; using the default toolchain instead."
            fi
          else
            chosen="$(printf '%s\n' "${candidates}" | tail -n 1 || true)"
          fi

          if [ -n "${chosen}" ] && [ -d "${chosen}/Contents/Developer" ]; then
            echo "DEVELOPER_DIR=${chosen}/Contents/Developer" >> "${GITHUB_ENV}"
            echo "Using ${chosen}"
          else
            echo "Keeping the runner's default toolchain: $(xcode-select -p || echo unknown)"
          fi

      - name: Confirm the toolchain that will be used
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-(default)}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      # ---------------------------------------------------------------- checks
      - name: Regenerate the Xcode project and check it is committed
        run: |
          set -euo pipefail
          python3 Scripts/generate_xcodeproj.py
          if ! git diff --quiet -- CustomKeyboard.xcodeproj; then
            echo "::error title=The generated Xcode project is out of date::Run 'python Scripts/generate_xcodeproj.py' and commit the result."
            git --no-pager diff --stat -- CustomKeyboard.xcodeproj || true
            exit 1
          fi
          echo "The committed Xcode project matches the generator."

      - name: Validate project metadata (plists, entitlements, targets)
        run: python3 Scripts/validate_project.py

      - name: Static source checks
        run: python3 Scripts/check_swift_safety.py

      # ---------------------------------------------------------------- tests
      # These tests cover the shared core through SwiftPM. A failing or
      # non-compiling test target must not stop the IPA from being produced:
      # the artefact and its validation are the primary result of this job.
      # The outcome is reported in the job summary below.
      - name: Run the shared model, engine and geometry tests
        id: swift-test
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          swift test --package-path . 2>&1 | tee build/swift-test.log

      # ---------------------------------------------------------------- preflight
      # Split out from the build so that a failure here (broken project file,
      # unresolvable scheme, unreadable Info.plist) is attributable without
      # having to read the full xcodebuild log.
      - name: Inspect the project before building
        run: |
          set -euo pipefail
          echo "=== schemes and targets ==="
          xcodebuild -list -project CustomKeyboard.xcodeproj
          echo "=== Info.plist syntax ==="
          plutil -lint CustomKeyboardApp/Info.plist CustomKeyboardExtension/Info.plist
          echo "=== entitlements syntax ==="
          plutil -lint CustomKeyboardApp/CustomKeyboardApp.entitlements \
                      CustomKeyboardExtension/CustomKeyboardExtension.entitlements
          echo "=== resolved build settings (app target) ==="
          xcodebuild -project CustomKeyboard.xcodeproj -scheme CustomKeyboard \
            -configuration Release -sdk iphoneos \
            -showBuildSettings 2>/dev/null \
            | grep -E '^ +(PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|PRODUCT_MODULE_NAME|INFOPLIST_FILE|CODE_SIGN_ENTITLEMENTS|IPHONEOS_DEPLOYMENT_TARGET|ARCHS|SDKROOT|TARGETED_DEVICE_FAMILY|WRAPPER_EXTENSION) ' \
            | sort -u || true

      # ---------------------------------------------------------------- build
      - name: Build the app, embed the keyboard extension and package the IPA
        run: |
          set -o pipefail
          # The shared tests already ran in their own step above, with their own
          # reported outcome; do not run them a second time inside the build.
          KEYRA_SKIP_TESTS=1 \
          KEYRA_MARKETING_VERSION="1.0" KEYRA_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
            bash Scripts/build_unsigned_ipa.sh 2>&1 | tee build/build.log

      - name: Validate the IPA structure
        run: bash Scripts/validate_ipa.sh build/Artifacts/CustomKeyboard.ipa

      - name: Inspect the built app bundle (diagnostics)
        run: bash Scripts/inspect_bundle.sh build/Artifacts/Payload || true

      # ---------------------------------------------------------------- report
      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## Keyra IPA build"
            echo ""
            echo "- Runner: \`${{ runner.os }} / ${{ inputs.runner || 'macos-26' }}\`"
            echo "- Xcode: \`$(xcodebuild -version 2>/dev/null | head -n 1 || echo unknown)\`"
            echo "- iphoneos SDK: \`$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo unknown)\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            if [ -f build/Artifacts/build-info.txt ]; then
              echo "### Artifact"
              echo '```'
              cat build/Artifacts/build-info.txt
              echo '```'
            fi
            echo "- Shared unit tests: \`${{ steps.swift-test.outcome }}\` (they do not gate the IPA)"
            echo ""
            echo "### Installing with SideStore"
            echo "1. Download the \`CustomKeyboard.ipa\` artifact from this run."
            echo "2. In SideStore: **My Apps → +** and pick the IPA (or open it from Files and choose SideStore)."
            echo "3. Keep the embedded extension \`CustomKeyboardKeyboard\` **selected** while installing — SideStore registers it as a second App ID, and without it the keyboard is never installed."
            echo "4. Open **Keyra** once, then Settings → General → Keyboard → Keyboards → Add New Keyboard → Keyra, and enable **Allow Full Access** so the keyboard can read your layouts from the App Group."
            echo "5. If the host app reports *App Group unreachable*, the shared container was not signed in: the keyboard still works from its built-in configuration. See docs/TROUBLESHOOTING.md."
          } >> "${GITHUB_STEP_SUMMARY}"

      # ---------------------------------------------------------------- artifacts
      - name: Upload the IPA, checksums and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyra-ipa-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/Artifacts/CustomKeyboard.ipa
            build/Artifacts/CustomKeyboard.ipa.sha256
            build/Artifacts/build-info.txt
            build/Artifacts/xcodebuild.log
            build/build.log
            build/swift-test.log

      - name: Upload the build log when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: keyra-failure-logs-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/Artifacts/xcodebuild.log
            build/build.log
            build/swift-test.log

      # Artifacts need a signed-in GitHub session to download. This publishes the
      # same diagnostics as a Release asset so the failure can be read from
      # anywhere (plain HTTPS, no authentication).
      - name: Publish the diagnostics for out-of-band inspection
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="ci-logs"
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_OS}"
            echo
            echo "### xcodebuild.log (last 800 lines)"
            tail -n 800 build/Artifacts/xcodebuild.log 2>/dev/null || echo "(no xcodebuild.log)"
            echo
            echo "### build.log (last 400 lines)"
            tail -n 400 build/build.log 2>/dev/null || echo "(no build.log)"
            echo
            echo "### swift-test.log (last 200 lines)"
            tail -n 200 build/swift-test.log 2>/dev/null || echo "(no swift-test.log)"
          } > ci-debug.txt 2>/dev/null || true
          [ -s ci-debug.txt ] || echo "no logs were produced by this run" > ci-debug.txt

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" ci-debug.txt --clobber
          else
            gh release create "${tag}" ci-debug.txt \
              --title "CI diagnostics" \
              --notes "Automatically published logs from the most recent failed build. Not a release; safe to delete."
          fi
          echo "Diagnostics: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/ci-debug.txt"

      - name: Attach the IPA to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            v*) ;;
            *) tag="keyra-build-$(date -u +%Y%m%d-%H%M%S)" ;;
          esac

          assets="build/Artifacts/CustomKeyboard.ipa build/Artifacts/CustomKeyboard.ipa.sha256"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" ${assets} --clobber
          else
            gh release create "${tag}" ${assets} \
              --title "Keyra ${tag}" \
              --notes "Unsigned Keyra build for SideStore, built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC').
          Download CustomKeyboard.ipa, then install it with SideStore. Enable App Groups for Keyra in SideStore before installing so the keyboard extension can read your layouts."
          fi
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
